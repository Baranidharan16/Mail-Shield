# Render Blueprint: ONE public web service (frontend + API) + managed PostgreSQL.
# Render → New → Blueprint → this repo.  Public URL: https://mailshield-sih.onrender.com
services:
  - type: web
    name: mailshield-sih
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mailshield-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://mailshield-sih.onrender.com
      - key: CORS_ORIGINS
        value: https://mailshield-sih.onrender.com,https://sih-email-forensics-full.vercel.app
      - key: LOAD_ML_MODELS
        value: "false"
      - key: UPLOAD_STORAGE_DIR
        value: /tmp/evidence
      - key: GOOGLE_REDIRECT_URI
        value: https://mailshield-sih.onrender.com/auth/google/callback
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: mailshield-db
    plan: free
    databaseName: mailshield
    user: mailshield
