services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensics_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-email_forensics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-forensics}:${POSTGRES_PASSWORD:-forensics_dev_password}@postgres:5432/${POSTGRES_DB:-email_forensics}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: "http://localhost:5173,http://localhost"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # REQUIRED: set JWT_SECRET_KEY in your shell or a root .env file (never commit it)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      FERNET_KEY: ${FERNET_KEY:-}
      UPLOAD_STORAGE_DIR: /app/storage/evidence
      MAX_UPLOAD_SIZE_BYTES: "10485760"
      RATE_LIMIT_PER_MINUTE: "30"
      # Isolated sandbox (reachable only over the internal sandbox_net network)
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_SHARED_SECRET: ${SANDBOX_SHARED_SECRET:?Set SANDBOX_SHARED_SECRET (python -c "import secrets; print(secrets.token_urlsafe(48))")}
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/storage/evidence
    networks: [default, sandbox_net]

  # ── Isolated static-analysis sandbox ────────────────────────────────────────
  # * separate image built from ./sandbox — no app code, no DB driver, no Gmail/Google libs
  # * ONLY on sandbox_net (internal: no internet egress, cannot reach postgres)
  # * no volumes / host mounts, read-only root FS, non-root, all capabilities dropped
  # * the only secret it holds is the HMAC key used to authenticate the backend
  sandbox:
    build:
      context: ./sandbox
    restart: unless-stopped
    environment:
      SANDBOX_SHARED_SECRET: ${SANDBOX_SHARED_SECRET:?Set SANDBOX_SHARED_SECRET}
      PORT: "8080"
    networks: [sandbox_net]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

networks:
  default: {}
  sandbox_net:
    internal: true   # no route to the internet or to the default network (postgres)

volumes:
  postgres_data:
  evidence_storage:
